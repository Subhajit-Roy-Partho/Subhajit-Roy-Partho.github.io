name: deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node 🔧
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies 📦
        run: npm ci

      - name: Check server-module boundary 🔒
        run: bash scripts/check-server-boundary.sh

      - name: Strip dynamic routes (static export) 🧹
        run: rm -rf app/api "app/(auth)" app/vault app/admin app/keys

      - name: Build (static export) 🏗️
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_ENABLE_DB: "0"

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages
