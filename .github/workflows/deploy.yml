name: deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node 🔧
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies 📦
        run: npm ci

      - name: Check server-module boundary 🔒
        run: bash scripts/check-server-boundary.sh

      - name: Strip dynamic routes (static export) 🧹
        run: rm -rf app/api "app/(auth)" app/vault app/admin app/keys

      - name: Build (static export) 🏗️
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_ENABLE_DB: "0"
          # Static mirror has no backend: absolute links (nav "Sign in ↗",
          # DbPlaceholder, apibank LiveLinks) must point at the live site,
          # never the localhost dev fallback.
          NEXT_PUBLIC_SITE_URL: "https://subhajit-roy-partho-github-io-subhajit-roys-projects.vercel.app"
          # Same GA measurement ID as Vercel (code default in app/layout.tsx;
          # pinned here so the Pages export can never drift).
          NEXT_PUBLIC_GA_ID: "G-X8WMNMXDWQ"

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages
